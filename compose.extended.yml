services:
  azure:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --disableProductStyleUrl
    ports: ["10000:10000"]
  gcs:
    image: fsouza/fake-gcs-server@sha256:3730da0e31f7e5186a90ec4899dc2c336104e7599df400411392ef17e684c31f
    command: ["-scheme", "http", "-port", "4443", "-public-host", "gcs:4443", "-external-url", "http://gcs:4443"]
    ports: ["4443:4443"]
  ftps:
    build: docker/extended
    image: plenora-storage-extended-fixtures:0.2
    command: ["ftps"]
    ports: ["2122:21", "30100-30163:30100-30163"]
    volumes: ["./.fixtures/extended:/certs:ro"]
    healthcheck:
      test: [CMD, python, -c, 'import ftplib, ssl; c = ftplib.FTP_TLS(context=ssl.create_default_context(cafile=''/certs/server.crt''), timeout=5); c.connect(''ftps'', 21); c.auth(); c.login(''plenora'', ''plenora-fixture-secret''); c.prot_p(); c.nlst(); c.close()']
      interval: 2s
      timeout: 10s
      retries: 30
  webdav:
    image: plenora-storage-extended-fixtures:0.2
    command: ["webdav"]
    ports: ["8088:8080"]
    healthcheck:
      test: [CMD, python, -c, 'import base64, urllib.request as u; t = base64.b64encode(b''plenora:plenora-fixture-secret'').decode(); r = u.Request(''http://127.0.0.1:8080/'', method=''PROPFIND'', data=b'''', headers={''Depth'': ''0'', ''Authorization'': ''Basic '' + t}); assert u.urlopen(r, timeout=5).status == 207']
      interval: 2s
      timeout: 10s
      retries: 30
  smb:
    image: plenora-storage-extended-fixtures:0.2
    command: ["smb"]
    ports: ["1445:445"]
    healthcheck:
      test: [CMD, smbclient, //127.0.0.1/storage, -U, plenora%plenora-fixture-secret, -m, SMB3, --option=client smb encrypt=required, -c, ls]
      interval: 2s
      timeout: 10s
      retries: 30
  azure-init:
    image: plenora-storage-extended-fixtures:0.2
    command: ["azure-init"]
  storage-rust:
    environment:
      PLENORA_EXTENDED_TEST: "1"
