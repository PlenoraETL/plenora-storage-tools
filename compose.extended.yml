services:
  azure:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --disableProductStyleUrl
    ports: ["10000:10000"]
  gcs:
    image: fsouza/fake-gcs-server@sha256:3730da0e31f7e5186a90ec4899dc2c336104e7599df400411392ef17e684c31f
    command: ["-scheme", "http", "-port", "4443", "-public-host", "gcs:4443", "-external-url", "http://gcs:4443"]
    ports: ["4443:4443"]
  ftps:
    build: docker/extended
    image: plenora-storage-extended-fixtures:0.2
    command: ["ftps"]
    ports: ["2122:21", "30100-30163:30100-30163"]
    volumes: ["./.fixtures/extended:/certs:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 21), 2); s.settimeout(2); assert s.recv(3) == b'220'"]
      interval: 2s
      timeout: 3s
      retries: 30
  webdav:
    image: plenora-storage-extended-fixtures:0.2
    command: ["webdav"]
    ports: ["8088:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 8080), 2); s.settimeout(2); s.sendall(b'GET / HTTP/1.1\\r\\nHost: f\\r\\nConnection: close\\r\\n\\r\\n'); assert s.recv(7) == b'HTTP/1.'"]
      interval: 2s
      timeout: 3s
      retries: 30
  smb:
    image: plenora-storage-extended-fixtures:0.2
    command: ["smb"]
    ports: ["1445:445"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 445), 2); s.settimeout(2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 30
  azure-init:
    image: plenora-storage-extended-fixtures:0.2
    command: ["azure-init"]
  storage-rust:
    environment:
      PLENORA_EXTENDED_TEST: "1"
