[package]
name = "plenora-storage-providers"
description = "Local, Azure Blob, Google Cloud Storage, SMB and WebDAV adapters for Plenora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"

[features]
default = ["full"]
full = ["local", "azure", "gcs", "smb", "webdav"]
local = ["dep:cap-std"]
azure = ["dep:object_store", "dep:reqwest", "dep:rustls", "dep:quick-xml", "dep:url", "dep:base64", "dep:hmac", "dep:time"]
gcs = ["dep:reqwest", "dep:rustls", "dep:url"]
smb = ["dep:smb2"]
webdav = ["dep:reqwest", "dep:rustls", "dep:quick-xml", "dep:url", "dep:percent-encoding"]

[dependencies]
hex.workspace = true
async-trait.workspace = true
bytes.workspace = true
base64 = { version = "=0.22.1", optional = true }
hmac = { version = "=0.13.0", optional = true }
time = { workspace = true, optional = true }
percent-encoding = { version = "=2.3.2", optional = true }
cap-std = { workspace = true, optional = true }
futures-util.workspace = true
object_store = { version = "=0.14.2", default-features = false, features = ["azure"], optional = true }
plenora-storage-core = { path = "../plenora-storage-core", version = "3.0.0" }
quick-xml = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls"], optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "=3.27.0"
smb2 = { workspace = true, optional = true }
tokio.workspace = true
tokio-util.workspace = true
url = { workspace = true, optional = true }

[lints]
workspace = true
