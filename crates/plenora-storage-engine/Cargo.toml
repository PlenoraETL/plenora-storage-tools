[package]
name = "plenora-storage-engine"
description = "Application composition and selectable storage providers for Plenora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"

[features]
default = ["full"]
full = ["local", "s3", "sftp", "ftp", "ftps", "azure", "gcs", "smb", "webdav"]
local = ["dep:plenora-storage-providers", "plenora-storage-providers/local"]
s3 = ["dep:plenora-storage-s3"]
sftp = ["dep:plenora-storage-sftp"]
ftp = ["dep:plenora-storage-ftp"]
ftps = ["dep:plenora-storage-ftp"]
azure = ["dep:plenora-storage-providers", "plenora-storage-providers/azure"]
gcs = ["dep:plenora-storage-providers", "plenora-storage-providers/gcs"]
smb = ["dep:plenora-storage-providers", "plenora-storage-providers/smb"]
webdav = ["dep:plenora-storage-providers", "plenora-storage-providers/webdav"]

[dependencies]
tokio.workspace = true
plenora-storage-core = { path = "../plenora-storage-core", version = "0.2.2" }
plenora-storage-s3 = { path = "../plenora-storage-s3", version = "0.2.2", default-features = false, optional = true }
plenora-storage-sftp = { path = "../plenora-storage-sftp", version = "0.2.2", default-features = false, optional = true }
plenora-storage-ftp = { path = "../plenora-storage-ftp", version = "0.2.2", default-features = false, optional = true }
plenora-storage-providers = { path = "../plenora-storage-providers", version = "0.2.2", default-features = false, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
