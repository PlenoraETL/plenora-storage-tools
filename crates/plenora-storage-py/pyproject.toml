[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "plenora-storage"
version = "2.1.0"
description = "Provider-neutral storage SDK backed by the Plenora Rust engine"
requires-python = ">=3.10"
license = { text = "Proprietary" }
readme = "README.md"
authors = [{ name = "PlenoraETL contributors" }]

[project.urls]
Repository = "https://github.com/PlenoraETL/plenora-storage-tools"

[tool.maturin]
python-source = "python"
module-name = "plenora_storage._native"
features = ["pyo3/extension-module"]
include = ["python/plenora_storage/py.typed", "python/plenora_storage/*.pyi"]
