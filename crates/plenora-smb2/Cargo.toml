[package]
name = "plenora-smb2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pure-Rust SMB2/3 client library with pipelined I/O"
documentation = "https://docs.rs/smb2"
readme = "README.md"
keywords = ["smb", "smb2", "smb3", "cifs", "network"]
categories = ["network-programming", "filesystem"]
# Vendored fork of smb2 0.22.1: the upstream license applies (PROVENANCE.md).
license = "MIT OR Apache-2.0"
repository = "https://github.com/vdavid/smb2"
exclude = ["tests/"]

[package.metadata.docs.rs]
all-features = true

[features]
fuzzing = []
serde = ["dep:serde"]
testing = []

[lib]
name = "smb2"
path = "src/lib.rs"

# Exact pins: the versions resolved in Cargo.lock since 0.2.2 and audited by
# `cargo audit`, `cargo deny` and `scripts/audit_smb_upstream.py`. A bump is a
# reviewed change of this fork, not something a consumer's resolver decides.
# Dependencies that cross the workspace's public API boundary are inherited
# from the workspace, so they follow its reviewed compatibility policy
# (`scripts/dependency-policy.json`) instead of a second, narrower pin.
[dependencies]
# AES block cipher for Kerberos AES-CTS and SMB3 key schedules.
aes = "=0.9.3"
# AES-GCM AEAD for SMB 3.1.1 encryption and GMAC signing.
aes-gcm = "=0.11.1"
# Public transport traits are `async_trait`s (workspace public-boundary policy).
async-trait.workspace = true
# AES-CCM AEAD for SMB 3.0/3.0.2 encryption.
ccm = "=0.6.1"
# AES-CMAC signing for SMB 3.0.
cmac = "=0.8.0"
# Digest traits shared by the hash and MAC crates below.
digest = "=0.11.3"
# Stream combinators for pipelined reads and writes.
futures-util = { workspace = true, features = ["std", "async-await"] }
# Operating-system random source for nonces, salts, challenges and GUIDs.
getrandom = "=0.4.3"
# HMAC for NTLMv2, Kerberos checksums and the SP800-108 KDF.
hmac = "=0.13.0"
# Logging facade used by the upstream diagnostics.
log = "=0.4.34"
# LZ4 for SMB 3.1.1 compression.
lz4_flex = "=0.14.0"
# MD5 for RC4-HMAC (Kerberos etype 23).
md-5 = "=0.11.0"
# MD4 for the NT hash (NTLM and RC4-HMAC keys).
md4 = "=0.11.0"
# Wire enums with checked integer conversion.
num_enum = "=0.7.6"
# PBKDF2 for the Kerberos AES string-to-key.
pbkdf2 = "=0.13.0"
# Optional serde support for public types (workspace public-boundary policy).
serde = { workspace = true, optional = true }
# SHA-1 for Kerberos AES checksums.
sha1 = "=0.11.0"
# SHA-256/512 for the KDF and the SMB 3.1.1 preauth integrity hash.
sha2.workspace = true
# Error derive for the public `Error` type.
thiserror.workspace = true
# Async runtime for the transport (workspace public-boundary policy).
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt"] }

[dev-dependencies]
# Log output in upstream tests.
env_logger = "=0.11.11"
# Property tests of the wire codecs.
proptest = "=1.11.0"
# JSON round trips of the serde feature in tests.
serde_json.workspace = true
# test-util: paused time drives the response-deadline tests deterministically.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "test-util"] }

[lints]
workspace = true
