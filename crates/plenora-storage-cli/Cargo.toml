[package]
name = "plenora-storage-cli"
description = "Plenora provider-neutral storage cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
exclude = ["tests/protocol.rs"]

[[bin]]
name = "plenora-storage"
path = "src/main.rs"

[dependencies]
clap.workspace = true
futures-util.workspace = true
plenora-storage-core = { path = "../plenora-storage-core", version = "0.2.0" }
plenora-storage-ftp = { path = "../plenora-storage-ftp", version = "0.2.0" }
plenora-storage-s3 = { path = "../plenora-storage-s3", version = "0.2.0" }
plenora-storage-sftp = { path = "../plenora-storage-sftp", version = "0.2.0" }
plenora-storage-providers = { path = "../plenora-storage-providers", version = "0.2.0" }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
jsonschema.workspace = true
