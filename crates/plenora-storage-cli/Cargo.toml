[package]
name = "plenora-storage-cli"
description = "Plenora provider-neutral storage cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
exclude = ["tests/protocol.rs"]

[[bin]]
name = "plenora-storage"
path = "src/main.rs"

[features]
default = ["full"]
full = ["local", "s3", "sftp", "ftp", "ftps", "azure", "gcs", "smb", "webdav"]
local = ["plenora-storage-engine/local"]
s3 = ["plenora-storage-engine/s3"]
sftp = ["plenora-storage-engine/sftp"]
ftp = ["plenora-storage-engine/ftp"]
ftps = ["plenora-storage-engine/ftps"]
azure = ["plenora-storage-engine/azure"]
gcs = ["plenora-storage-engine/gcs"]
smb = ["plenora-storage-engine/smb"]
webdav = ["plenora-storage-engine/webdav"]

[dependencies]
plenora-storage-engine = { path = "../plenora-storage-engine", version = "0.2.1", default-features = false }
clap.workspace = true
futures-util.workspace = true
plenora-storage-core = { path = "../plenora-storage-core", version = "0.2.1" }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
jsonschema.workspace = true
