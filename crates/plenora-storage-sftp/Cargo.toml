[package]
name = "plenora-storage-sftp"
description = "Plenora provider-neutral storage sftp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

license-file.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
hex.workspace = true
async-trait.workspace = true
plenora-storage-core = { path = "../plenora-storage-core", version = "3.0.0" }
russh.workspace = true
russh-sftp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# Standalone SFTP builds must not rely on a TLS provider enabling this feature.
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["prebuilt-nasm"] }

[lints]
workspace = true

[dev-dependencies]
# Paused time lets the request-timeout tests advance 30 s of server delay
# deterministically, without real sleeps.
tokio = { workspace = true, features = ["test-util"] }
