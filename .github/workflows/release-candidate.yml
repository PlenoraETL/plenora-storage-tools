name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-compatibility:
    needs: [linux, windows]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ runner.os == 'Windows' && 'storage-candidate-windows' || 'storage-candidate-linux' }}
          path: downloaded-wheel
      - run: python -m pip install -r scripts/requirements-coverage.txt
      - run: python -m pip install -r scripts/requirements-sdk-typing.txt
      - run: python scripts/check_installed_sdk.py downloaded-wheel --coverage --typing --output target/sdk-compatibility
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-python-${{ matrix.os }}-${{ matrix.python }}
          path: target/sdk-compatibility/

  parser-fuzz:
    uses: ./.github/workflows/parser-fuzz.yml

  api-compatibility:
    uses: ./.github/workflows/api-compatibility.yml

  dependencies:
    needs: [api-compatibility, parser-fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: |
          mkdir -p target/release-evidence
          cargo audit --deny warnings --json > target/release-evidence/audit.json
      - run: cargo audit --file tools/api-inventory/Cargo.lock --deny warnings --json > target/release-evidence/api-audit.json
      - run: cargo audit --file fuzz/Cargo.lock --deny warnings --json > target/release-evidence/fuzz-audit.json
      - run: python3 scripts/audit_smb_upstream.py
      - run: python3 scripts/run_logged.py target/release-evidence/deny.log cargo deny --locked check
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dependency-evidence
          path: |
            target/release-evidence/
            target/release-readiness/smb-upstream-audit.json

  linux:
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose build storage-rust
      - run: bash scripts/prepare-fixtures.sh
      - run: bash scripts/prepare-extended-fixtures.sh
      - run: python3 scripts/run_logged.py target/release-evidence/x86_64-unknown-linux-gnu-tests.log docker compose -f docker-compose.yml -f compose.extended.yml run --rm --no-deps storage-rust
      - name: Build and qualify release in Debian Bookworm
        run: |
          docker compose -f docker-compose.yml -f compose.extended.yml run --rm --no-deps storage-rust bash -c '
            set -euo pipefail
            version="$(python3 scripts/release_version.py)"
            cargo fetch --locked
            python3 scripts/run_logged.py .fixtures/evidence/build-linux.log python3 scripts/build_release.py
            cp .fixtures/ca.crt /usr/local/share/ca-certificates/plenora-storage-fixture.crt
            update-ca-certificates
            python3 scripts/run_logged.py .fixtures/evidence/qualify-linux.log python3 scripts/qualify_target.py "dist/$version/x86_64-unknown-linux-gnu"
          '
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-diagnostics-linux
          path: |
            target/release-evidence/
            .fixtures/evidence/
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-candidate-linux
          path: |
            dist/
            target/release-evidence/
          if-no-files-found: error
      - if: always()
        run: docker compose -f docker-compose.yml -f compose.extended.yml down

  windows:
    needs: dependencies
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: python scripts/run_logged.py target/release-evidence/x86_64-pc-windows-msvc-tests.log cargo test --workspace --all-targets --locked
      - run: cargo fetch --locked
      - run: python -m pip install maturin==1.15.0
      - run: python scripts/run_logged.py target/release-evidence/build-windows.log python scripts/build_release.py
      - name: Qualify released binary on localhost
        shell: pwsh
        run: |
          $version = python scripts/release_version.py
          $env:PLENORA_CLI_BIN = (Resolve-Path "dist/$version/x86_64-pc-windows-msvc/plenora-storage.exe").Path
          python scripts/audit_release_readiness.py
          python scripts/qualify_extended_faults.py
          Copy-Item target/release-readiness/extended-regressions.json dist/$version/x86_64-pc-windows-msvc/
          Copy-Item target/release-readiness/results.json dist/$version/x86_64-pc-windows-msvc/cli-regressions.json
          python scripts/verify_release.py dist/$version
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-diagnostics-windows
          path: target/release-evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-candidate-windows
          path: |
            dist/
            target/release-evidence/
          if-no-files-found: error
