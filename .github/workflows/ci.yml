name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  proof-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - run: python3 scripts/check_proof_inventory.py
      - if: always()
        run: python3 -m unittest discover -s scripts/tests -p test_proof_inventory.py -v
      - if: always()
        run: python3 -m unittest discover -s scripts/tests -p test_proof_collection.py -v
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proof-source-inventory
          path: target/proof-inventory.json

  production-coverage:
    uses: ./.github/workflows/coverage.yml

  parser-fuzz:
    uses: ./.github/workflows/parser-fuzz.yml

  api-compatibility:
    uses: ./.github/workflows/api-compatibility.yml

  product-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: clippy, rustfmt
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - run: cargo fetch --locked
      - run: python3 scripts/check_features.py
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/check_test_layout.py
      - run: python3 scripts/check_comments.py
      - run: python3 scripts/check_dependencies.py
      - run: python3 scripts/check_anti_panic.py
      - run: python3 scripts/check_packages.py --build
      - run: python3 scripts/code_size.py --check --output target/code-size.json
      - run: python3 scripts/check_rust_docs.py
      - run: python3 scripts/package_source.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-consumer-linux
          path: target/source-bundle/
      - run: python3 -m pip install -r scripts/requirements-quality.txt
      # The campaign checks read access control lists with getfacl: the
      # tests use the one of the system package `acl`, installed here and
      # verified (test_campaign_fence.RealAclToolTests).
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends acl
          dpkg -S "$(readlink -f "$(command -v getfacl)")" | grep -q '^acl: '
      - run: python3 scripts/check_contract_adoption.py
      - run: python3 scripts/check_release_guard_coverage.py
      - run: python3 -m unittest discover -s scripts/tests -v
        env:
          PLENORA_REQUIRE_REAL_ACL: '1'
          # The runner qualifies the binaries also as user 65534: the test
          # that runs the private copies as that user may not be skipped.
          PLENORA_REQUIRE_UNPRIVILEGED_RUN: '1'
      - run: python3 scripts/render_sbom.py target/storage-sbom.cdx.json
      - run: python3 scripts/render_sbom.py target/storage-sbom.cdx.json --check
      - run: python3 scripts/render_sbom.py target/qualification-sbom.cdx.json --qualification
      - run: python3 scripts/render_sbom.py target/qualification-sbom.cdx.json --qualification --check
      - run: python3 scripts/build_python.py --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-wheel-linux
          path: target/python-wheels/*.whl
          if-no-files-found: error

  docker-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Rust image
        run: docker compose build storage-rust
      - name: Prepare secure storage test fixtures
        run: python3 scripts/run_logged.py .fixtures/prepare-fixtures.log bash scripts/prepare-fixtures.sh
      - name: Prepare extended storage fixtures
        run: python3 scripts/run_logged.py .fixtures/prepare-extended-fixtures.log bash scripts/prepare-extended-fixtures.sh
      - name: Verify Rust, contracts, and CLI
        run: python3 scripts/run_logged.py target/release-readiness/docker-conformance.log docker compose -f docker-compose.yml -f compose.extended.yml run --rm --no-deps storage-rust
      - name: Build and verify the Linux candidate artifacts in Bookworm
        run: |
          docker compose -f docker-compose.yml -f compose.extended.yml run --rm --no-deps storage-rust bash -c '
            set -euo pipefail
            version="$(python3 scripts/release_version.py)"
            cargo fetch --locked
            python3 scripts/run_logged.py target/release-evidence/build-linux.log python3 scripts/build_release.py
            cp .fixtures/ca.crt /usr/local/share/ca-certificates/plenora-storage-fixture.crt
            update-ca-certificates
            python3 scripts/qualify_target.py "dist/$version/x86_64-unknown-linux-gnu"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guard-candidate-linux
          path: dist/
          if-no-files-found: error
      - name: Preserve fixture diagnostics and qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-qualification
          path: |
            .fixtures/certificate-generation.log
            .fixtures/prepare-fixtures.log
            .fixtures/prepare-extended-fixtures.log
            .fixtures/extended/certificate-generation.log
            .fixtures/evidence/
            target/release-readiness/*.json
            target/release-readiness/*.log
            target/python-wheels/python-tests.*
          include-hidden-files: true
      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.yml -f compose.extended.yml down

  python-compatibility:
    needs: [product-quality, native-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ runner.os == 'Windows' && 'windows-qualification' || 'python-wheel-linux' }}
          path: downloaded-wheel
      - run: python -m pip install -r scripts/requirements-coverage.txt
      - run: python -m pip install -r scripts/requirements-sdk-typing.txt
      - run: python scripts/check_installed_sdk.py downloaded-wheel --coverage --typing --output target/sdk-compatibility
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-${{ matrix.os }}-${{ matrix.python }}
          path: target/sdk-compatibility/

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: clippy, rustfmt
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      # The script tests on Windows too: the campaign controller's job object
      # (campaign_fence) has a Windows-only branch.
      - run: python -m pip install -r scripts/requirements-quality.txt
      - run: cargo fetch --locked
      - run: python scripts/check_contract_adoption.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: python scripts/check_anti_panic.py
      - run: python scripts/check_packages.py --build
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --locked -p plenora-storage-cli
      - run: python scripts/release_publication.py smoke-cli --binary target/debug/plenora-storage.exe
      - run: python -m pip install maturin==1.16.0
      - run: python scripts/build_python.py --debug
      - run: python scripts/run_logged.py target/release-evidence/build-windows.log python scripts/build_release.py
      - name: Verify the Windows candidate artifacts
        shell: pwsh
        run: |
          $version = python scripts/release_version.py
          python scripts/qualify_windows_candidate.py dist/$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guard-candidate-windows
          path: dist/
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-qualification
          path: |
            target/release-readiness/*.json
            target/python-wheels/python-tests.*
            target/python-wheels/*.whl
            dist/**/source-consumer.*
            dist/**/*-source.tar.gz

  dependencies:
    uses: ./.github/workflows/dependencies.yml

  release-package-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - run: cargo fetch --locked
      - run: cargo package --workspace --exclude plenora-storage-py --no-verify --locked --offline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-regression
          path: target/package/*.crate
          if-no-files-found: error

  release-package-recheck:
    needs: [release-package-build, docker-conformance, native-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Separate runner: no producer Cargo cache. Keep prerequisites aligned with
    # release qualify/publish (enforced by test_release_workflow.py).
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - run: cargo fetch --locked
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-quality.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package-regression
          path: target/release-package-regression
      - run: python scripts/check_release_packages.py target/release-package-regression
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: guard-candidate-*
          merge-multiple: true
          path: target/candidate-recheck
      - name: Exercise candidate and publication guards on the built bytes
        run: |
          version="$(python scripts/release_version.py)"
          python scripts/check_release_packages.py "target/candidate-recheck/$version" --release
