name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  product-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo fetch --locked
      - run: python3 scripts/check_features.py
      - run: python3 scripts/check_docs.py
      - run: python3 -m pip install -r scripts/requirements-quality.txt
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/render_sbom.py target/storage-sbom.cdx.json
      - run: python3 scripts/render_sbom.py target/storage-sbom.cdx.json --check
      - run: python3 scripts/build_python.py --debug

  docker-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Rust image
        run: docker compose build storage-rust
      - name: Prepare secure storage test fixtures
        run: bash scripts/prepare-fixtures.sh
      - name: Prepare extended storage fixtures
        run: bash scripts/prepare-extended-fixtures.sh
      - name: Verify Rust, contracts, and CLI
        run: docker compose -f docker-compose.yml -f compose.extended.yml run --rm --no-deps storage-rust
      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.yml -f compose.extended.yml down

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --locked -p plenora-storage-cli
      - run: python scripts/audit_release_readiness.py
      - run: python scripts/qualify_extended_faults.py
      - run: python -m pip install maturin==1.15.0
      - run: python scripts/build_python.py --debug

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit --deny warnings
      - run: python3 scripts/audit_smb_upstream.py
      - run: cargo deny --locked check
