name: production-coverage

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose build storage-rust
      - run: bash scripts/prepare-fixtures.sh
      - run: bash scripts/prepare-extended-fixtures.sh
      - name: Measure production sources through Rust, CLI and Python
        run: docker compose -f docker-compose.yml -f compose.extended.yml run --rm --no-deps storage-rust bash scripts/coverage.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-coverage
          path: |
            .fixtures/evidence/coverage-*.json
            .fixtures/evidence/coverage-*.log
            .fixtures/evidence/rust-coverage.json
          include-hidden-files: true
      - if: always()
        run: docker compose -f docker-compose.yml -f compose.extended.yml down
