name: scheduled

# Weekly, independent of pushes: advisories and yanked crates appear without a
# commit. Parser exploration requires an explicit manual request.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    uses: ./.github/workflows/dependencies.yml

  parser-fuzz:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/parser-fuzz.yml
    with:
      seconds: '300'
