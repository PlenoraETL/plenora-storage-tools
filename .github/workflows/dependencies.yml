name: dependencies

# Shared by ci (every push and pull request) and scheduled (weekly), so an
# advisory published after the last push still fails a run within a week.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit --deny warnings
      - run: cargo audit --file tools/api-inventory/Cargo.lock --deny warnings
      - run: cargo audit --file fuzz/Cargo.lock --deny warnings
      - run: python3 scripts/audit_smb_upstream.py
      - run: cargo deny --locked check
