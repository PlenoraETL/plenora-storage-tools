name: api-compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path tools/api-inventory/Cargo.toml
      - run: cargo fmt --manifest-path tools/api-inventory/Cargo.toml -- --check
      - run: cargo clippy --locked --offline --manifest-path tools/api-inventory/Cargo.toml -- -D warnings
      - run: python scripts/check_api_metadata.py
      - run: python scripts/check_rust_api.py
      - run: python scripts/test_rust_api_gate.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-compatibility-${{ runner.os }}
          path: target/api-current/
