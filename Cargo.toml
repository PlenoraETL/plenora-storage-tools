[workspace]
members = [
    "crates/plenora-storage-core",
    "crates/plenora-storage-s3",
    "crates/plenora-storage-sftp",
    "crates/plenora-storage-ftp",
    "crates/plenora-storage-providers",
    "crates/plenora-smb2",
    "crates/plenora-storage-cli",
    "crates/plenora-storage-engine",
    "crates/plenora-storage-py",
]
default-members = ["crates/plenora-storage-core", "crates/plenora-storage-engine", "crates/plenora-storage-cli"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["PlenoraETL contributors"]
repository = "https://github.com/PlenoraETL/plenora-storage-tools"

[workspace.dependencies]
hex = "0.4.3"
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
jsonschema = { version = "0.56.0", default-features = false }
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
# Pin HTTP endpoints to the addresses validated by the network policy.
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
# Minimum applies to consumers of the S3 crate as well as this lockfile.
# Earlier 0.23.x releases are affected by RUSTSEC-2026-0285.
rustls = { version = "0.23.45", default-features = false }
quick-xml = { version = "0.42.0", features = ["serialize"] }
russh = { version = "0.63.3", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
suppaftp = { version = "12.0.1", default-features = false, features = ["tokio-rustls-aws-lc-rs", "no-log"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-native-certs = "0.8.4"
cap-std = "4.0.3"
smb2 = { package = "plenora-smb2", path = "crates/plenora-smb2", version = "0.2.2" }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt", "io"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
overflow-checks = true
