[workspace]
members = [
    "crates/plenora-storage-core",
    "crates/plenora-storage-s3",
    "crates/plenora-storage-sftp",
    "crates/plenora-storage-ftp",
    "crates/plenora-storage-providers",
    "crates/plenora-smb2",
    "crates/plenora-storage-cli",
    "crates/plenora-storage-engine",
    "crates/plenora-storage-py",
]
default-members = ["crates/plenora-storage-core", "crates/plenora-storage-engine", "crates/plenora-storage-cli"]
resolver = "3"

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.92"
# I crate usano la licenza proprietaria del repository; sono distribuiti solo
# come asset delle GitHub Release, non su crates.io. `publish = false` non è
# impostato perché impedirebbe a `cargo package --workspace` (build_release.py)
# di risolvere le dipendenze tra crate del workspace.
# `license-file` è il campo Cargo previsto quando non esiste un identificatore
# SPDX applicabile; i manifest figli lo ereditano dal workspace. Il fork
# `plenora-smb2` non eredita questo campo: conserva la licenza upstream
# (MIT OR Apache-2.0) e i relativi testi, come richiesto da quelle licenze.
license-file = "LICENSE"
authors = ["PlenoraETL contributors"]
repository = "https://github.com/PlenoraETL/plenora-storage-tools"

[workspace.dependencies]
hex = "=0.4.3"
# Range, not an exact pin (deviation DEP-RANGE-1): the public async provider traits
# expand through this macro; consumers must resolve the same compatible release.
async-trait = "0.1.92"
# Range, not an exact pin (deviation DEP-RANGE-1): `Bytes` crosses the public provider
# factory boundary; an exact pin would conflict with any consumer on another 1.x patch.
bytes = "1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
futures-util = "=0.3.34"
jsonschema = { version = "=0.56.0", default-features = false }
# Operating-system random source for the new message identity of every runtime
# result (Runtime Binding 1.0 RT-020). Same version already locked through
# plenora-smb2, so no new crate enters the build.
getrandom = "=0.4.3"
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
# Pin HTTP endpoints to the addresses validated by the network policy.
reqwest = { version = "=0.13.5", default-features = false, features = ["stream"] }
# Minimum applies to consumers of the S3 crate as well as this lockfile.
# Earlier 0.23.x releases are affected by RUSTSEC-2026-0285.
rustls = { version = "=0.23.45", default-features = false }
quick-xml = { version = "=0.42.0", features = ["serialize"] }
russh = { version = "=0.63.3", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "=3.0.0"
# Range, not an exact pin (deviation DEP-RANGE-1): public DTOs implement Serde traits
# that consumers use; an exact pin would force their serde patch.
serde = { version = "1.0.229", features = ["derive"] }
# Range, not an exact pin (deviation DEP-RANGE-1): public connection and runtime DTOs
# expose `serde_json::Value`.
serde_json = "1.0.151"
sha2 = "=0.11.0"
suppaftp = { version = "=12.0.1", default-features = false, features = ["tokio-rustls-aws-lc-rs", "no-log"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-native-certs = "=0.8.4"
cap-std = "=4.0.3"
smb2 = { package = "plenora-smb2", path = "crates/plenora-smb2", version = "2.1.0" }
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
# Range, not an exact pin (deviation DEP-RANGE-1): public source and sink interfaces use
# Tokio I/O traits and must share the host's Tokio.
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Range, not an exact pin (deviation DEP-RANGE-1): cancellation must coexist with the
# host's Tokio utilities.
tokio-util = { version = "0.7.19", features = ["rt", "io"] }
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
overflow-checks = true
