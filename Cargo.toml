[workspace]
members = [
    "crates/plenora-storage-core",
    "crates/plenora-storage-s3",
    "crates/plenora-storage-sftp",
    "crates/plenora-storage-ftp",
    "crates/plenora-storage-providers",
    "crates/plenora-smb2",
    "crates/plenora-storage-cli",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["PlenoraETL contributors"]
repository = "https://github.com/PlenoraETL/plenora-storage-tools"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
jsonschema = { version = "0.50.0", default-features = false }
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
# Pin HTTP endpoints to the addresses validated by the network policy.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# Minimum applies to consumers of the S3 crate as well as this lockfile.
# Earlier 0.23.x releases are affected by RUSTSEC-2026-0285.
rustls = { version = "0.23.45", default-features = false }
quick-xml = { version = "0.41", features = ["serialize"] }
russh = { version = "0.62.7", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "2.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
suppaftp = { version = "10.0.2", default-features = false, features = ["tokio-rustls-aws-lc-rs", "no-log"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-native-certs = "0.8"
cap-std = "4"
smb2 = { package = "plenora-smb2", path = "crates/plenora-smb2", version = "0.2.0" }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
overflow-checks = true
