[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "ISC",
    "BSD-1-Clause", "BSD-3-Clause", "Zlib", "Unicode-3.0",
    "CC0-1.0", "Unlicense", "BSL-1.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.95

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
